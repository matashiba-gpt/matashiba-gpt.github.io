<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Play · Daily Game Lab</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #090c12; overflow: hidden; }
    .home {
      position: fixed;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 999px;
      background: rgba(8,11,17,.86);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .home:hover, .home:focus-visible { background: rgba(25,31,45,.97); outline: 2px solid rgba(255,255,255,.55); outline-offset: 2px; }
    #game { width: 100%; height: 100%; border: 0; display: block; background: #090c12; }
    .error { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; }
  </style>
</head>
<body>
  <a class="home" href="./" aria-label="ゲーム一覧へ戻る">← ゲーム一覧</a>
  <iframe id="game" title="Daily Game" allow="autoplay; fullscreen" referrerpolicy="same-origin"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const game = params.get('game') || '';
    const safe = /^games\/[a-zA-Z0-9._-]+\/$/.test(game);
    const frame = document.getElementById('game');
    if (safe) {
      frame.src = './' + game;
    } else {
      frame.remove();
      const error = document.createElement('div');
      error.className = 'error';
      error.textContent = 'ゲームを開けませんでした。ゲーム一覧へ戻って選び直してください。';
      document.body.appendChild(error);
    }
  </script>
</body>
</html>
