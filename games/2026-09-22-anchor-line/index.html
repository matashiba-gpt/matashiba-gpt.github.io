<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Anchor Line</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08111d;color:#eef6ff}main{max-width:860px;margin:auto;padding:18px}h1{margin:.1em 0;font-size:clamp(24px,5vw,40px)}p{margin:.4em 0 12px;color:#bcd0e6}.hud{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;margin:8px 0}canvas{display:block;width:100%;aspect-ratio:16/10;background:#0b1b2b;border:1px solid #31506d;border-radius:14px;touch-action:none}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px}button{font:inherit;padding:10px 16px;border:0;border-radius:10px;background:#dcecff;color:#07111c;font-weight:800}.status{min-height:1.5em;font-weight:800}@media(max-width:520px){main{padding:12px}.hud{font-size:14px}}
</style><style id="daily-game-direct-header-style">
#daily-game-direct-header[hidden]{display:none!important}
#daily-game-direct-header{min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.16);background:#0b0f17;color:#fff;font:700 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#daily-game-direct-header a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;background:#151b27}
#daily-game-direct-header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head><body>
<header id="daily-game-direct-header" hidden><a href="../../">← ゲーム一覧</a><strong>Daily Game Lab</strong></header>
<script>if(window.top===window.self){document.getElementById('daily-game-direct-header').hidden=false}</script><main><h1>Anchor Line</h1><p>2つのアンカーをドラッグしてラインを張り、流れるカプセルを同じ色のベイへ導こう。ラインに触れると進行方向が反射する。6個ドックで勝利、3個流出で失敗。</p><div class="hud"><span id="dock">ドック 0 / 6</span><span id="lost">流出 0 / 3</span><span>青→左ベイ　橙→右ベイ</span></div><canvas id="game" width="800" height="500" aria-label="アンカーを動かしてカプセルの進路を変えるゲーム"></canvas><div class="controls"><div class="status" id="status">アンカーを動かして最初のカプセルを迎えよう</div><button id="restart">リスタート</button></div></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d'),dockEl=document.querySelector('#dock'),lostEl=document.querySelector('#lost'),statusEl=document.querySelector('#status');const W=c.width,H=c.height,R=11;let anchors,caps,docked,lost,start,last,drag,state;
const schedule=[[0,'b',90,55,78,72],[1400,'o',710,55,-76,74],[3000,'b',650,70,-92,82],[4400,'o',150,70,92,82],[5900,'b',300,45,45,98],[7200,'o',500,45,-45,98],[8700,'b',680,85,-108,70],[10000,'o',120,85,108,70],[11600,'b',390,45,-22,112],[13000,'o',410,45,22,112]];
function reset(){anchors=[{x:300,y:260},{x:500,y:260}];caps=[];docked=lost=0;start=performance.now();last=start;drag=-1;state='playing';statusEl.textContent='アンカーを動かして最初のカプセルを迎えよう';sync();}
function sync(){dockEl.textContent=`ドック ${docked} / 6`;lostEl.textContent=`流出 ${lost} / 3`;window.__DAILY_GAME__.state=state;}
function spawn(now){for(const s of schedule){if(!s.done&&now-start>=s[0]){s.done=true;caps.push({col:s[1],x:s[2],y:s[3],vx:s[4],vy:s[5],hit:0});}}}
function closestPoint(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,den=dx*dx+dy*dy;if(den<1)return{x:a.x,y:a.y};const t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/den));return{x:a.x+t*dx,y:a.y+t*dy};}
function reflect(q,a,b){const lx=b.x-a.x,ly=b.y-a.y,L=Math.hypot(lx,ly);if(L<20)return;const cp=closestPoint(q.x,q.y,a,b),dx=q.x-cp.x,dy=q.y-cp.y,d=Math.hypot(dx,dy);if(d<R+5&&q.hit<=0){const nx=-ly/L,ny=lx/L,dot=q.vx*nx+q.vy*ny;q.vx-=2*dot*nx;q.vy-=2*dot*ny;q.x+=nx*(R+6-d)*Math.sign(dx*nx+dy*ny||1);q.y+=ny*(R+6-d)*Math.sign(dx*nx+dy*ny||1);q.hit=.18;}}
function end(s,msg){state=s;statusEl.textContent=msg;sync();}
function update(now){if(state!=='playing')return;spawn(now);const dt=Math.min(.03,(now-last)/1000);last=now;for(let i=caps.length-1;i>=0;i--){const q=caps[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.hit-=dt;reflect(q,anchors[0],anchors[1]);if(q.y>H-42&&((q.col==='b'&&q.x<155)||(q.col==='o'&&q.x>645))){caps.splice(i,1);docked++;statusEl.textContent='ドック成功！ 次の進路を読もう';sync();if(docked>=6)end('won','クリア！ 6個ドック成功');continue}if(q.x<-25||q.x>W+25||q.y>H+25){caps.splice(i,1);lost++;statusEl.textContent='流出！ ラインの角度を調整しよう';sync();if(lost>=3)end('lost','失敗。3個流出 — すぐ再挑戦できるよ');}}}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#10283b';x.fillRect(0,0,W,H);x.fillStyle='#173e61';x.fillRect(0,H-42,155,42);x.fillStyle='#7b431c';x.fillRect(645,H-42,155,42);x.font='bold 18px system-ui';x.fillStyle='#9ed8ff';x.fillText('青 BAY',42,H-15);x.fillStyle='#ffc27a';x.fillText('橙 BAY',690,H-15);const a=anchors[0],b=anchors[1];x.strokeStyle='#f4f8ff';x.lineWidth=5;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();for(const [i,p] of anchors.entries()){x.fillStyle=i?'#ffda7b':'#7be4ff';x.beginPath();x.arc(p.x,p.y,15,0,Math.PI*2);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()}for(const q of caps){x.strokeStyle=q.col==='b'?'#62c7ff':'#ff9b4a';x.globalAlpha=.35;x.lineWidth=2;x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x+q.vx*.65,q.y+q.vy*.65);x.stroke();x.globalAlpha=1;x.fillStyle=q.col==='b'?'#62c7ff':'#ff9b4a';x.beginPath();x.arc(q.x,q.y,R,0,Math.PI*2);x.fill();if(q.hit>0){x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(q.x,q.y,R+7,0,Math.PI*2);x.stroke()}}}
function loop(t){update(t);draw();requestAnimationFrame(loop)}function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
c.addEventListener('pointerdown',e=>{const p=pos(e);drag=anchors.findIndex(a=>Math.hypot(a.x-p.x,a.y-p.y)<34);if(drag>=0)c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag<0||state!=='playing')return;const p=pos(e);anchors[drag].x=Math.max(30,Math.min(W-30,p.x));anchors[drag].y=Math.max(90,Math.min(H-70,p.y));statusEl.textContent='ライン更新 — 投影線で反射後を予想しよう'});c.addEventListener('pointerup',()=>drag=-1);document.querySelector('#restart').onclick=()=>{for(const s of schedule)delete s.done;reset()};window.__DAILY_GAME__={ready:true,state:'playing',restart(){for(const s of schedule)delete s.done;reset()}};reset();requestAnimationFrame(loop)})();
</script></body></html>
