<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shadow Market</title><style>
:root{font-family:system-ui,sans-serif;color:#e8ecff;background:#0d1020}*{box-sizing:border-box}body{margin:0;padding:20px;min-height:100vh}.wrap{max-width:920px;margin:auto}h1{margin:.2em 0}.how,.status,.result{background:#171c35;border:1px solid #303a68;border-radius:12px;padding:12px;margin:10px 0}.hud{display:flex;gap:18px;flex-wrap:wrap;font-weight:700}.lots{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.lot{min-height:154px;border:2px solid #3a477d;border-radius:12px;background:#151a30;color:inherit;padding:10px;text-align:left}.lot:not(:disabled){cursor:pointer}.lot.selected{outline:3px solid #e6d36c}.lot.owned{border-color:#72d5a5}.lot.closed{opacity:.48}.name{font-weight:800;font-size:1.05rem}.demand{font-size:1.35rem;font-weight:900;margin:9px 0}.bidbox{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}.bidbox button,#restart{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.bidbox button:disabled{opacity:.4;cursor:not-allowed}.result{min-height:52px}.good{color:#8cf0b7}.bad{color:#ff9e9e}@media(max-width:650px){body{padding:12px}.lots{grid-template-columns:1fr}.lot{min-height:105px}.hud{gap:10px}}
</style><style id="daily-game-direct-header-style">
#daily-game-direct-header[hidden]{display:none!important}
#daily-game-direct-header{min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.16);background:#0b0f17;color:#fff;font:700 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#daily-game-direct-header a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;background:#151b27}
#daily-game-direct-header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head><body>
<header id="daily-game-direct-header" hidden><a href="../../">← ゲーム一覧</a><strong>Daily Game Lab</strong></header>
<script>if(window.top===window.self){document.getElementById('daily-game-direct-header').hidden=false}</script><main class="wrap"><h1>Shadow Market</h1><div class="how">5つの競売品から1つを選び、入札額を決めます。<strong>最低落札額は非公開</strong>で、競り負けても現金は減りませんが、その品の競売は終了します。落札すると左右の品の需要が上がり、次の最低落札額も変化します。3ラウンド終了時に<strong>資産価値60以上</strong>を目指してください。公開された価値の手掛かりと前の競売結果から、どこにいくら出すかを読んでください。</div><div class="status"><div class="hud"><span>ラウンド <b id="round">1</b>/3</span><span>現金 <b id="cash">70</b></span><span>資産価値 <b id="value">0</b>/60</span></div><div id="hint">品を選ぶと公開情報を確認できます。</div></div><section id="lots" class="lots" aria-label="競売品"></section><div class="bidbox" aria-label="入札操作"><button data-bid="12">慎重 12</button><button data-bid="18">標準 18</button><button data-bid="25">強気 25</button></div><div id="result" class="result" aria-live="polite">まず競売品を1つ選んでください。</div><button id="restart">最初から</button></main><script>
(()=>{const base=[{n:'琥珀端末',cat:'技術',clue:'価値は20以上',v:24,t:16},{n:'藍の標本',cat:'希少品',clue:'価値は30未満',v:27,t:20},{n:'黒曜工具',cat:'工業',clue:'価値は25以上',v:31,t:23},{n:'銀紙文書',cat:'資料',clue:'価値は20未満',v:18,t:14},{n:'朱の機構',cat:'機械',clue:'価値は30以上',v:35,t:25}];let s;const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll('[data-bid]')];function reset(){s={round:1,cash:70,value:0,sel:null,lots:base.map((x,i)=>({...x,d:0,done:false,i})),state:'playing'};window.__DAILY_GAME__.state='playing';$('result').className='result';$('result').textContent='まず競売品を1つ選んでください。';render()}function render(){ $('round').textContent=s.round;$('cash').textContent=s.cash;$('value').textContent=s.value;const box=$('lots');box.innerHTML='';s.lots.forEach((x,i)=>{const b=document.createElement('button');b.className='lot'+(s.sel===i?' selected':'')+(x.done?' closed':'');b.disabled=x.done||s.state!=='playing';b.setAttribute('aria-label',`${x.n}、${x.cat}、${x.clue}、需要${x.d}`);b.innerHTML=`<div class="name">${x.n}</div><div>${x.cat} / ${x.clue}</div><div class="demand">需要 +${x.d}</div><small>${x.done?'競売終了':'選択して入札'}</small>`;b.onclick=()=>{s.sel=i;$('hint').textContent=`${x.n}: ${x.cat}。${x.clue}。現在の需要補正 +${x.d}。`;render()};box.appendChild(b)});buttons.forEach(b=>b.disabled=s.sel===null||s.state!=='playing'||Number(b.dataset.bid)>s.cash)}function bid(amount){if(s.sel===null||s.state!=='playing')return;const x=s.lots[s.sel];const need=x.t+x.d;const win=amount>=need;if(win){s.cash-=amount;s.value+=x.v;x.done=true;[x.i-1,x.i+1].forEach(i=>{if(s.lots[i]&&!s.lots[i].done)s.lots[i].d+=3});$('result').className='result good';$('result').textContent=`落札！ ${x.n}の真価は${x.v}。最低落札額は${need}でした。隣接品の需要が+3上昇しました。`}else{x.done=true;$('result').className='result bad';$('result').textContent=`競り負け。最低落札額は${need}、入札は${amount}でした。現金は失いません。`}s.sel=null;if(s.round>=3){s.state=s.value>=60?'won':'lost';window.__DAILY_GAME__.state=s.state;$('hint').textContent=s.state==='won'?'市場を読み切りました。目標達成！':'取引終了。目標未達です。順番と入札額を変えて再挑戦できます。'}else{s.round++;$('hint').textContent='次の競売品を選んでください。落札済み・終了品は選べません。'}render()}buttons.forEach(b=>b.onclick=()=>bid(Number(b.dataset.bid)));$('restart').onclick=reset;window.__DAILY_GAME__={ready:true,state:'playing',restart:reset};reset()})();
</script></body></html>
