<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Debt</title><style>
*{box-sizing:border-box}body{margin:0;background:#08121d;color:#eef7ff;font-family:system-ui,sans-serif}main{width:min(760px,100%);margin:auto;padding:20px}.lead{color:#bfd0df;line-height:1.55}.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin:12px 0;font-weight:800}.clock{height:8px;background:#172b3c;border-radius:9px;overflow:hidden;margin:8px 0 16px}.clock i{display:block;height:100%;background:#7ed6ef;transition:width .18s}.towers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tower{border:1px solid #29465d;border-radius:16px;background:#102233;padding:14px;min-height:205px}.tower h2{margin:0 0 8px;font-size:18px}.antenna{height:42px;display:grid;place-items:center;font-size:34px}.reading{min-height:70px;color:#bed0dd;line-height:1.4}.value{font-size:28px;font-weight:900;color:#fff}.stale{color:#ffcf73;font-weight:800}.tower button,.controls button{width:100%;border:0;border-radius:11px;padding:12px;font-weight:900;font-size:15px;cursor:pointer}.sample{background:#6fc8e8;color:#082030}.lock{margin-top:7px;background:#f3c76b;color:#2b2108}.controls{display:flex;gap:10px;margin-top:12px}.restart{background:#d7e2e9;color:#142a3a}.msg{min-height:3em;margin:12px 0;font-weight:750;line-height:1.45}.result{border-radius:12px;background:#10293a;padding:10px;min-height:3em;color:#cfe2ee}.good{color:#83e0aa}.bad{color:#ff9292}.hint{font-size:13px;color:#91aabd}@media(max-width:560px){main{padding:12px}.towers{grid-template-columns:1fr}.tower{min-height:0}.reading{min-height:55px}.hud{font-size:14px}}
</style><style id="daily-game-direct-header-style">
#daily-game-direct-header[hidden]{display:none!important}
#daily-game-direct-header{min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.16);background:#0b0f17;color:#fff;font:700 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#daily-game-direct-header a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;background:#151b27}
#daily-game-direct-header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head><body>
<header id="daily-game-direct-header" hidden><a href="../../">← ゲーム一覧</a><strong>Daily Game Lab</strong></header>
<script>if(window.top===window.self){document.getElementById('daily-game-direct-header').hidden=false}</script><main><h1>Signal Debt</h1><p class="lead">3つの塔から安全な回線を選び、<strong>5回の通信成功</strong>を目指します。塔を観測すると強度と傾向が分かりますが、観測するたび全信号が1刻進み、古い測定は借金になります。3回失敗で終了。</p><div class="hud"><span id="progress">成功 0 / 5</span><span id="drops">失敗 0 / 3</span><span id="time">時刻 0</span></div><div class="clock"><i id="clockbar"></i></div><section id="towers" class="towers" aria-label="無線塔"></section><div id="msg" class="msg" aria-live="polite">まず塔を1つ観測。もっと調べるか、今ある情報で回線を固定するか決めよう。</div><div id="result" class="result">固定すると、その時刻の3塔すべての実効強度を答え合わせできます。</div><div class="controls"><button id="restart" class="restart">最初からやり直す</button></div><p class="hint">実効強度50以上で通信成功。干渉中の塔は強度が18下がります。干渉帯は A→B→C→A… と1刻ごとに移動します。</p></main><script>
(()=>{'use strict';const names=['A塔','B塔','C塔'];const patterns=[[62,74,67,48,35,44],[46,39,52,69,76,61],[70,55,40,37,51,68]];let tick,success,drops,round,state,last;
const towers=document.querySelector('#towers'),msg=document.querySelector('#msg'),result=document.querySelector('#result');
function raw(i,t){return patterns[i][(t+round*2+i)%6]}function jam(t){return t%3}function net(i,t){return raw(i,t)-(jam(t)===i?18:0)}function arrow(i,t){const a=net(i,t),b=net(i,t+1);return b>a+3?'↑':b<a-3?'↓':'→'}
function sample(i){if(state!=='playing')return;const v=net(i,tick),tr=arrow(i,tick);last[i]={v,tr,at:tick};tick++;msg.textContent=names[i]+'を観測。時刻が1つ進み、他の測定も1刻古くなりました。';render({i,type:'sample'})}
function lock(i){if(state!=='playing')return;const vals=names.map((_,j)=>net(j,tick)),ok=vals[i]>=50;if(ok)success++;else drops++;result.innerHTML=(ok?'<b class="good">通信成功</b>':'<b class="bad">通信失敗</b>')+' — '+names.map((n,j)=>n+' '+vals[j]).join(' / ')+'。選択は '+names[i]+'。';if(success>=5){state='won';msg.textContent='5回接続成功！ 古い情報と観測コストを読み切りました。'}else if(drops>=3){state='lost';msg.textContent='3回切断。観測しすぎる前に、傾向と干渉の移動から先を読もう。'}else{round++;tick++;last=[null,null,null];msg.textContent='次の通信へ。信号曲線は続いています。必要な分だけ観測しよう。'}render(state==='playing'?{i,type:'lock'}:null)}
function render(focus){towers.innerHTML='';names.forEach((n,i)=>{const box=document.createElement('article');box.className='tower';const r=last[i],age=r?tick-r.at:null;box.innerHTML='<h2>'+n+'</h2><div class="antenna">⌁</div><div class="reading">'+(r?'<span class="value">'+r.v+' '+r.tr+'</span><br><span class="'+(age>1?'stale':'')+'">測定 '+age+'刻前</span>':'未観測<br>強度 ? / 傾向 ?')+'</div><button class="sample" aria-label="'+n+'を観測">観測する（+1刻）</button><button class="lock" aria-label="'+n+'に回線を固定">この塔で通信</button>';box.querySelector('.sample').onclick=()=>sample(i);box.querySelector('.lock').onclick=()=>lock(i);towers.append(box)});document.querySelector('#progress').textContent='成功 '+success+' / 5';document.querySelector('#drops').textContent='失敗 '+drops+' / 3';document.querySelector('#time').textContent='時刻 '+tick+' ・干渉 '+names[jam(tick)];document.querySelector('#clockbar').style.width=((tick%6)/5*100)+'%';window.__DAILY_GAME__.state=state;if(focus){const box=towers.children[focus.i];if(box)box.querySelector('.'+focus.type)?.focus()}}
function restart(){tick=0;success=0;drops=0;round=0;state='playing';last=[null,null,null];msg.textContent='まず塔を1つ観測。もっと調べるか、今ある情報で回線を固定するか決めよう。';result.textContent='固定すると、その時刻の3塔すべての実効強度を答え合わせできます。';render()}
window.__DAILY_GAME__={ready:true,state:'playing',restart,getState:()=>({state,tick,round,success,drops,jammed:jam(tick),last:last.map(x=>x&&({...x})),actual:names.map((_,i)=>net(i,tick))})};document.querySelector('#restart').onclick=restart;restart();})();
</script></body></html>
