<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Echo Tax</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081019;color:#eef7ff}main{max-width:760px;margin:auto;padding:16px}h1{margin:.1em 0;font-size:clamp(28px,7vw,44px)}p{color:#b9ccdc;line-height:1.45;margin:.35em 0 12px}.hud,.forecast,.actions{display:grid;gap:10px}.hud{grid-template-columns:repeat(3,1fr);margin:12px 0}.tile,.threat,.action{border:1px solid #31485a;border-radius:12px;background:#101e29;padding:12px}.tile b{display:block;font-size:1.35rem}.forecast{grid-template-columns:repeat(3,1fr);margin:12px 0}.threat{text-align:center;min-height:86px}.threat.now{outline:2px solid #d7efff}.threat .icon{font-size:1.7rem}.actions{grid-template-columns:repeat(3,1fr)}button.action{color:#eef7ff;font:inherit;text-align:left;cursor:pointer;min-height:118px;touch-action:manipulation}.action strong,.action span{display:block}.action strong{font-size:1.08rem}.action .cost{margin-top:8px;font-weight:800;color:#aee5ff}.action.taxed{border-color:#ffbd6b;background:#2a2018}.action:disabled{opacity:.45;cursor:not-allowed}.status{min-height:3.2em;margin:12px 0;padding:10px 12px;border-radius:10px;background:#132431;font-weight:700}.legend{font-size:.9rem}.restart{font:inherit;font-weight:800;padding:10px 16px;border:0;border-radius:10px}.pulse{animation:pulse .25s ease-out}@keyframes pulse{50%{transform:scale(1.02)}}@media(max-width:560px){main{padding:12px}.hud{font-size:.86rem}.forecast{grid-template-columns:1fr 1fr 1fr}.threat{padding:8px;font-size:.82rem}.actions{grid-template-columns:1fr}.action{min-height:82px!important}}
</style><style id="daily-game-direct-header-style">
#daily-game-direct-header[hidden]{display:none!important}
#daily-game-direct-header{min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.16);background:#0b0f17;color:#fff;font:700 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#daily-game-direct-header a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;background:#151b27}
#daily-game-direct-header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head><body>
<header id="daily-game-direct-header" hidden><a href="../../">← ゲーム一覧</a><strong>Daily Game Lab</strong></header>
<script>if(window.top===window.self){document.getElementById('daily-game-direct-header').hidden=false}</script><main><h1>Echo Tax</h1><p>12ビートを生き残れ。毎ビート、迫る脅威に合う行動を1つ選ぶ。同じ行動は次の1ビートだけ<strong>反響税 +2</strong>で高くなる。完璧な対処を今使うか、次の手のために節約するか。</p><div class="hud"><div class="tile">エネルギー<b id="energy">30</b></div><div class="tile">ビート<b id="beat">1 / 12</b></div><div class="tile">突破<b id="breach">0 / 2</b></div></div><div class="legend">脅威予告（左が現在）</div><div class="forecast" id="forecast"></div><div class="status" id="status">現在の脅威を見て行動を選ぼう。</div><div class="actions" id="actions"></div><p class="legend">一致行動は脅威を完全除去。不一致でも1エネルギーを使って軽減できるが、突破が1増える。行動コストでエネルギーが0以下になっても敗北。</p><button class="restart" id="restart">リスタート</button></main><script>
(()=>{'use strict';
const threats=[0,1,0,2,1,1,2,0,2,2,1,0];
const kinds=[{name:'遮断',icon:'▰',desc:'壁圧'},{name:'放電',icon:'ϟ',desc:'電荷'},{name:'冷却',icon:'❄',desc:'熱波'}];
const base=[2,2,2];let beat,energy,breach,last,state;
const E=id=>document.getElementById(id),energyEl=E('energy'),beatEl=E('beat'),breachEl=E('breach'),forecast=E('forecast'),actions=E('actions'),status=E('status');
function cost(i){return base[i]+(last===i?2:0)}
function sync(){energyEl.textContent=energy;beatEl.textContent=`${Math.min(beat+1,12)} / 12`;breachEl.textContent=`${breach} / 2`;window.__DAILY_GAME__.state=state;drawForecast();drawActions()}
function drawForecast(){forecast.innerHTML='';for(let j=0;j<3;j++){const n=beat+j,d=document.createElement('div');d.className='threat'+(j===0?' now':'');if(n<12){const k=kinds[threats[n]];d.innerHTML=`<div class="icon">${k.icon}</div><b>${j===0?'現在':'+'+j} ${k.desc}</b>`}else d.innerHTML='<div class="icon">✓</div><b>安全</b>';forecast.appendChild(d)}}
function drawActions(){actions.innerHTML='';kinds.forEach((k,i)=>{const c=cost(i),b=document.createElement('button');b.className='action'+(last===i?' taxed':'');b.disabled=state!=='playing';b.setAttribute('aria-label',`${k.name}、コスト${c}${last===i?'、反響税あり':''}`);b.innerHTML=`<strong>${k.icon} ${k.name}</strong><span>${k.desc}に有効</span><span class="cost">コスト ${c}${last===i?'（+2 税）':''}</span>`;b.onclick=()=>act(i);actions.appendChild(b)})}
function end(s,msg){state=s;status.textContent=msg;sync()}
function act(i){if(state!=='playing')return;const c=cost(i);energy-=c;const match=i===threats[beat];if(!match){breach++;energy-=1}const old=last;last=i;beat++;status.classList.remove('pulse');void status.offsetWidth;status.classList.add('pulse');if(energy<=0)return end('lost',`エネルギー切れ。${beat}ビート目まで到達。税の連打を避けよう。`);if(breach>=2)return end('lost',`2回突破された。${beat}ビート目まで到達。予告から次の税を組み立てよう。`);if(beat>=12)return end('won',`クリア！ エネルギー${energy}を残して12ビート生存。`);const next=kinds[threats[beat]].desc;status.textContent=match?`${kinds[i].name}成功。${old===i?'高い税を払った。':'脅威を除去。'} 次は${next}。`:`不一致で突破 +1、追加消耗 -1。次は${next}。`;sync()}
function reset(){beat=0;energy=30;breach=0;last=-1;state='playing';status.textContent='現在の脅威を見て行動を選ぼう。';sync()}
E('restart').onclick=reset;window.__DAILY_GAME__={ready:true,state:'playing',restart:reset};reset();
})();</script></body></html>
