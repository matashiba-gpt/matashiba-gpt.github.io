<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tide Lock</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b2b;color:#eef8ff;font-family:system-ui,sans-serif}main{width:min(760px,100%);margin:auto;padding:20px}.lead{color:#b8d5e5;line-height:1.55}.hud{display:flex;justify-content:space-between;gap:8px;margin:12px 0;font-weight:700}.board{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#0b3046;padding:8px;border-radius:16px}.cell{aspect-ratio:1;background:#15506a;border:2px solid #246d87;border-radius:10px;position:relative;display:grid;place-items:center;overflow:hidden}.cell.shallow{background:#215b66}.dock{box-shadow:inset 0 0 0 4px #9bd9bc}.spill{box-shadow:inset 0 0 0 4px #df7c7c}.boat{width:48%;aspect-ratio:1.7;border-radius:50% 50% 35% 35%;display:grid;place-items:center;color:#071b2b;font-weight:900;z-index:3}.b0{background:#ffd36a}.b1{background:#f98ca8}.b2{background:#8ee6d0}.gate{width:62%;height:62%;border:0;border-radius:50%;background:#d8edf5;color:#09263a;font-size:26px;font-weight:900;cursor:pointer}.gate[data-dir="E"]{transform:rotate(0)}.gate[data-dir="S"]{transform:rotate(90deg)}.gate[data-dir="W"]{transform:rotate(180deg)}.gate[data-dir="N"]{transform:rotate(270deg)}.preview{position:absolute;right:4px;bottom:2px;font-size:18px;color:#fff}.controls{display:flex;gap:10px;margin-top:14px}.controls button{flex:1;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}.tide{background:#62c5e8;color:#062334}.restart{background:#d9e5eb;color:#183344}.msg{min-height:2.6em;margin-top:12px;font-weight:700}.legend{font-size:13px;color:#a9c8d8}@media(max-width:520px){main{padding:12px}.cell{border-radius:7px}.gate{font-size:20px}.hud{font-size:14px}}
</style><style id="daily-game-direct-header-style">
#daily-game-direct-header[hidden]{display:none!important}
#daily-game-direct-header{min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.16);background:#0b0f17;color:#fff;font:700 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#daily-game-direct-header a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;background:#151b27}
#daily-game-direct-header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head><body>
<header id="daily-game-direct-header" hidden><a href="../../">← ゲーム一覧</a><strong>Daily Game Lab</strong></header>
<script>if(window.top===window.self){document.getElementById('daily-game-direct-header').hidden=false}</script><main><h1>Tide Lock</h1><p class="lead">4つの水門を回して航路を決め、潮を動かすと<strong>すべての船が同時に1区画</strong>進みます。6回以内に3隻を同じ色の港へ。赤い排水路へ流すと失敗です。</p><div class="hud"><span id="steps">潮: 0 / 6</span><span id="level">次: 満潮 ↑</span><span id="docked">入港: 0 / 3</span></div><div id="board" class="board" aria-label="運河盤面"></div><div class="controls"><button id="tide" class="tide">潮を動かす</button><button id="restart" class="restart">やり直す</button></div><div id="msg" class="msg" aria-live="polite">水門をタップすると矢印が90°回転します。白い小矢印が次の移動予告です。</div><p class="legend">緑枠＝港 / 赤枠＝排水路。浅瀬は干潮では船が止まります。</p></main><script>
(()=>{'use strict';const W=5,H=5,dirs=['E','S','W','N'],dv={E:[1,0],S:[0,1],W:[-1,0],N:[0,-1]};
const gates=[{x:1,y:1,dir:'E'},{x:3,y:1,dir:'S'},{x:1,y:3,dir:'N'},{x:3,y:3,dir:'W'}];
const docks=[{x:4,y:0,b:0},{x:0,y:3,b:1},{x:3,y:4,b:2}],spill={x:2,y:2};const shallow=new Set(['2,0','2,4','0,2','4,2']);
const starts=[{x:0,y:0},{x:0,y:1},{x:4,y:3}];let boats,steps,high,state;
const board=document.querySelector('#board'),msg=document.querySelector('#msg');
function key(x,y){return x+','+y}function gateAt(x,y){return gates.find(g=>g.x===x&&g.y===y)}function dockAt(x,y,b){return docks.some(d=>d.x===x&&d.y===y&&d.b===b)}
function nextFor(b){if(b.docked)return null;const g=gateAt(b.x,b.y);let dir=g?g.dir:b.dir;const [dx,dy]=dv[dir],nx=b.x+dx,ny=b.y+dy;if(nx<0||nx>=W||ny<0||ny>=H)return null;if(!high&&shallow.has(key(nx,ny)))return null;return {x:nx,y:ny,dir};}
function render(){board.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=document.createElement('div');c.className='cell'+(shallow.has(key(x,y))?' shallow':'')+(docks.some(d=>d.x===x&&d.y===y)?' dock':'')+(spill.x===x&&spill.y===y?' spill':'');const g=gateAt(x,y);if(g){const bt=document.createElement('button');bt.className='gate';bt.dataset.dir=g.dir;bt.textContent='➜';bt.setAttribute('aria-label','水門 '+(gates.indexOf(g)+1)+' '+g.dir);bt.onclick=()=>{if(state!=='playing')return;g.dir=dirs[(dirs.indexOf(g.dir)+1)%4];render()};c.append(bt)}boats.forEach((b,i)=>{if(!b.docked&&b.x===x&&b.y===y){const el=document.createElement('div');el.className='boat b'+i;el.textContent=i+1;c.append(el);const n=nextFor(b);if(n){const p=document.createElement('span');p.className='preview';p.textContent={E:'→',S:'↓',W:'←',N:'↑'}[n.dir];c.append(p)}}});board.append(c)}document.querySelector('#steps').textContent='潮: '+steps+' / 6';document.querySelector('#level').textContent='次: '+(high?'干潮 ↓':'満潮 ↑');document.querySelector('#docked').textContent='入港: '+boats.filter(b=>b.docked).length+' / 3';window.__DAILY_GAME__.state=state}
function tide(){if(state!=='playing')return;high=!high;steps++;const plans=boats.map(nextFor);plans.forEach((n,i)=>{if(!n)return;boats[i].x=n.x;boats[i].y=n.y;boats[i].dir=n.dir;if(key(n.x,n.y)===key(spill.x,spill.y))state='lost';if(dockAt(n.x,n.y,i))boats[i].docked=true});if(boats.every(b=>b.docked))state='won';else if(steps>=6)state='lost';msg.textContent=state==='won'?'全船入港！ 潮を読み切りました。':state==='lost'?'航路失敗。水門の向きを変えて再挑戦しよう。':'潮が動き、船が同時に進みました。次の矢印を確認！';render()}
function restart(){boats=starts.map((p,i)=>({x:p.x,y:p.y,dir:i===2?'W':'E',docked:false}));steps=0;high=false;state='playing';gates.splice(0,4,{x:1,y:1,dir:'E'},{x:3,y:1,dir:'S'},{x:1,y:3,dir:'N'},{x:3,y:3,dir:'W'});msg.textContent='水門をタップすると矢印が90°回転します。白い小矢印が次の移動予告です。';render()}
window.__DAILY_GAME__={ready:true,state:'playing',restart,getState:()=>({state,steps,high,boats:boats.map(b=>({...b})),gates:gates.map(g=>({...g}))})};document.querySelector('#tide').onclick=tide;document.querySelector('#restart').onclick=restart;restart();})();
</script></body></html>
