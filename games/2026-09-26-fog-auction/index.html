<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fog Auction</title>
<style>
:root{font-family:system-ui,sans-serif;color:#15202a;background:#e9eef1}*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100vh}main{max-width:720px;margin:auto}h1{margin:.2em 0}.how{line-height:1.5}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.card,.panel{background:#fff;border:2px solid #263743;border-radius:12px;padding:10px}.label{font-size:.76rem;color:#5b6870}.big{font-size:1.2rem;font-weight:800}.panel{margin:10px 0}.scouts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.scouts.cols{margin-bottom:6px}.scouts.rows{grid-template-columns:1fr}.scouts.rows button{min-height:38px}.boardwrap{display:grid;grid-template-columns:74px 1fr;gap:6px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tile{aspect-ratio:1;border:2px solid #304550;border-radius:9px;font:inherit;font-weight:800;min-width:0;background:#637781;color:white;transition:transform .22s,background .18s}.tile.hidden{background:repeating-linear-gradient(135deg,#526772,#526772 8px,#5e737e 8px,#5e737e 16px);color:#eef4f6}.tile.revealed{background:#fff;color:#17252d}.tile.hazard{background:#f6d4cd;color:#782b1e}.tile:disabled{opacity:.58}.scout{font:inherit;border:2px solid #3a5260;border-radius:8px;background:#fff;min-height:42px;cursor:pointer}.scout.active{background:#cde7f2;font-weight:800}.shift{font-weight:800;min-height:1.5em}.status{font-weight:800;min-height:2.5em;margin:8px 0}.legend{font-size:.88rem;color:#53636c}.restart{font:inherit;min-height:46px;border:2px solid #263743;border-radius:9px;background:#fff;padding:8px 15px}@media(max-width:540px){body{padding:10px}.hud{grid-template-columns:1fr 1fr}.boardwrap{grid-template-columns:58px 1fr}.tile{font-size:.9rem}.scout{font-size:.82rem;padding:4px}}
</style><style id="daily-game-direct-header-style">
#daily-game-direct-header[hidden]{display:none!important}
#daily-game-direct-header{min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.16);background:#0b0f17;color:#fff;font:700 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#daily-game-direct-header a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;background:#151b27}
#daily-game-direct-header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head><body>
<header id="daily-game-direct-header" hidden><a href="../../">← ゲーム一覧</a><strong>Daily Game Lab</strong></header>
<script>if(window.top===window.self){document.getElementById('daily-game-direct-header').hidden=false}</script><main>
<h1>Fog Auction</h1>
<p class="how">まず<strong>行か列を偵察</strong>して4マスを公開。その直後、表示された方向へ<strong>まだ霧のマスだけ</strong>が1歩ずれます。公開した情報を手掛かりに1マス回収。5回で<strong>価値18以上</strong>を集めよう。危険物を2個取ると失敗です。</p>
<div class="hud"><div class="card"><div class="label">ターン</div><div class="big" id="turn"></div></div><div class="card"><div class="label">回収価値</div><div class="big" id="score"></div></div><div class="card"><div class="label">危険</div><div class="big" id="hazards"></div></div><div class="card"><div class="label">残り危険</div><div class="big" id="remaining"></div></div></div>
<div class="panel"><div class="shift" id="shift"></div><div class="legend">① 偵察 → ② 霧だけ移動 → ③ マスを回収</div></div>
<div class="scouts cols" id="cols"></div>
<div class="boardwrap"><div class="scouts rows" id="rows"></div><div class="board" id="board" aria-label="4×4の回収盤"></div></div>
<div class="panel"><div class="status" id="status" aria-live="polite"></div><button class="restart" id="restart">もう一度</button></div>
</main><script>
(function(){
var seed=[
 {v:2},{v:5},{h:1},{v:4},
 {v:6},{v:1},{v:3},{h:1},
 {v:4},{v:2},{v:7},{v:1},
 {h:1},{v:5},{v:3},{v:6}
], shifts=[["右","R"],["下","D"],["左","L"],["上","U"],["右","R"]];
var cells,turn,score,hazards,phase,state,scouted;
var board=document.getElementById("board"),rows=document.getElementById("rows"),cols=document.getElementById("cols"),status=document.getElementById("status");
function idx(r,c){return r*4+c} function pos(i){return [Math.floor(i/4),i%4]}
function nextShift(){return shifts[Math.min(turn,4)]}
function hiddenHazards(){return cells.filter(function(x){return x&&!x.claimed&&x.h}).length}
function render(){
 document.getElementById("turn").textContent=(Math.min(turn+1,5))+" / 5";
 document.getElementById("score").textContent=score+" / 18";
 document.getElementById("hazards").textContent=hazards+" / 2";
 document.getElementById("remaining").textContent=hiddenHazards();
 document.getElementById("shift").textContent=state==="playing"?"次の偵察後：霧のマスが「"+nextShift()[0]+"」へ1歩":"ゲーム終了";
 board.innerHTML="";cells.forEach(function(x,i){var b=document.createElement("button");b.className="tile "+(!x||x.claimed?"hidden":x.revealed?(x.h?"hazard":"revealed"):"hidden");b.disabled=state!=="playing"||phase!=="claim"||!x||x.claimed;
  b.textContent=!x||x.claimed?"—":x.revealed?(x.h?"⚠ 危険":"価値 "+x.v):"?";
  b.setAttribute("aria-label",(pos(i)[0]+1)+"行"+(pos(i)[1]+1)+"列 "+(!x||x.claimed?"回収済み":x.revealed?(x.h?"危険物":"価値"+x.v):"霧のマス"));
  b.onclick=function(){claim(i)};board.appendChild(b)});
 [rows,cols].forEach(function(el){Array.from(el.children).forEach(function(b){b.disabled=state!=="playing"||phase!=="scout"})});
}
function shiftHidden(dir){
 var old=cells.slice(), horizontal=dir==="R"||dir==="L", forward=dir==="R"||dir==="D";
 for(var g=0;g<4;g++){
  var slots=[];
  for(var p=0;p<4;p++){var i=horizontal?idx(g,p):idx(p,g),x=old[i];if(x&&!x.claimed&&!x.revealed)slots.push(i)}
  if(slots.length<2)continue;
  var vals=slots.map(function(i){return old[i]});
  slots.forEach(function(dest,k){var source=(k+(forward?-1:1)+slots.length)%slots.length;cells[dest]=vals[source]});
 }
}
function scout(kind,n){
 if(phase!=="scout"||state!=="playing")return;scouted={kind:kind,n:n};cells.forEach(function(x,i){var p=pos(i);if(x&&!x.claimed&&((kind==="r"&&p[0]===n)||(kind==="c"&&p[1]===n)))x.revealed=true});
 var s=nextShift();shiftHidden(s[1]);phase="claim";status.textContent=(kind==="r"?(n+1)+"行":(n+1)+"列")+"を偵察。霧のマスが「"+s[0]+"」へ移動した。1マス回収しよう。";render();
}
function claim(i){
 if(phase!=="claim"||state!=="playing")return;var x=cells[i];if(!x)return;x.claimed=true;x.revealed=true;var msg;if(x.h){hazards++;msg="危険物だった！"}else{score+=x.v;msg="価値 "+x.v+" を回収！"}turn++;
 if(hazards>=2){state="lost";msg+="　危険2個で失敗。"}else if(turn>=5){state=score>=18?"won":"lost";msg+=state==="won"?"　目標達成！":"　価値18に届かなかった。"}
 else{phase="scout";msg+="　次の偵察を選ぼう。"}window.__DAILY_GAME__.state=state;status.textContent=msg;render();
}
function controls(){rows.innerHTML="";cols.innerHTML="";for(let i=0;i<4;i++){var r=document.createElement("button");r.className="scout";r.textContent=(i+1)+"行";r.setAttribute("aria-label",(i+1)+"行を偵察");r.onclick=function(){scout("r",i)};rows.appendChild(r);var c=document.createElement("button");c.className="scout";c.textContent=(i+1)+"列";c.setAttribute("aria-label",(i+1)+"列を偵察");c.onclick=function(){scout("c",i)};cols.appendChild(c)}}
function restart(){cells=seed.map(function(x){return {v:x.v,h:x.h||0,revealed:false,claimed:false}});turn=0;score=0;hazards=0;phase="scout";state="playing";scouted=null;window.__DAILY_GAME__.state=state;status.textContent="最初の偵察先を選ぼう。公開後に霧だけが右へ動く。";render()}
controls();document.getElementById("restart").onclick=restart;window.__DAILY_GAME__={ready:true,state:"playing",restart:restart};restart();
})();
</script></body></html>
