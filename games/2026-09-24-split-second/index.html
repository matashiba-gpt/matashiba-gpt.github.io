<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Split Second</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef3ff;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}h1{margin:.2em 0}.help{color:#b9c7e8;line-height:1.55}.card{background:#151d34;border:1px solid #314064;border-radius:16px;padding:18px;margin:14px 0}.top,.stats,.preview{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.lane{flex:1;min-width:220px}.bar{height:14px;background:#28324b;border-radius:8px;overflow:hidden}.fill{height:100%;background:#9eb8ff}.bad{background:#ff8b8b}.alloc{text-align:center;font-size:1.35rem;font-weight:700;margin:12px}.slider{width:100%;accent-color:#9eb8ff}.preview{margin-top:12px}.pill{padding:8px 10px;background:#202b49;border-radius:10px;flex:1;text-align:center}.danger{outline:2px solid #ff8b8b}.good{outline:2px solid #80e0aa}button{width:100%;padding:14px;border:0;border-radius:12px;background:#d9e4ff;color:#10182b;font-weight:800;font-size:1rem;cursor:pointer}.msg{text-align:center;min-height:2.5em;font-weight:700}.small{font-size:.88rem;color:#9eafd4}@media(max-width:520px){main{padding-top:12px}.card{padding:14px}.stats{display:block}.lane{margin:12px 0}}</style><style id="daily-game-direct-header-style">
#daily-game-direct-header[hidden]{display:none!important}
#daily-game-direct-header{min-height:56px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.16);background:#0b0f17;color:#fff;font:700 14px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#daily-game-direct-header a{display:inline-flex;align-items:center;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.28);border-radius:10px;color:#fff;text-decoration:none;background:#151b27}
#daily-game-direct-header strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head><body>
<header id="daily-game-direct-header" hidden><a href="../../">← ゲーム一覧</a><strong>Daily Game Lab</strong></header>
<script>if(window.top===window.self){document.getElementById('daily-game-direct-header').hidden=false}</script><main><h1>Split Second</h1><p class="help">毎ターン6秒を「救助ドローン」と「解析」に分けます。スライダーを動かすと結果を先読みできます。10ターン生き残り、解析を100%まで進めれば脱出成功です。</p><section class="card"><div class="top"><strong id="beat"></strong><span id="demand"></span></div><div class="stats"><div class="lane"><p>救助ドローン耐久 <b id="hpText"></b></p><div class="bar"><div class="fill" id="hp"></div></div></div><div class="lane"><p>解析 <b id="decodeText"></b> / 汚染 <b id="corruptText"></b></p><div class="bar"><div class="fill" id="decode"></div></div><div class="bar" style="margin-top:5px"><div class="fill bad" id="corrupt"></div></div></div></div><div class="alloc"><span id="droneTime">3.0</span>秒 ← 6秒 → <span id="decodeTime">3.0</span>秒</div><input class="slider" id="split" aria-label="6秒の時間配分" type="range" min="0" max="60" value="30"><div class="preview"><div class="pill" id="dronePreview"></div><div class="pill" id="decodePreview"></div></div><p class="small">必要秒数を下回ると損害/汚染。余剰時間は耐久回復や解析の前倒しとして残ります。</p><button id="commit">この配分で進む</button><p class="msg" id="msg"></p></section><button id="restart" hidden>もう一度</button></main><script>const beats=[{d:2,x:2.6},{d:3.2,x:2},{d:1.8,x:3.6},{d:3.8,x:1.6},{d:2.7,x:3},{d:4.1,x:1.7},{d:2.1,x:3.8},{d:3.5,x:2.4},{d:2.5,x:3.7},{d:3.3,x:3.1}];let s;const $=id=>document.getElementById(id);function reset(){s={i:0,hp:72,dec:0,cor:0,state:'playing'};$('split').value=30;$('restart').hidden=true;$('commit').hidden=false;$('split').disabled=false;$('msg').textContent='';sync()}function calc(){let b=beats[Math.min(s.i,9)],dt=+$('split').value/10,xt=6-dt,dShort=Math.max(0,b.d-dt),xShort=Math.max(0,b.x-xt);return{dt,xt,dhp:dShort?-Math.ceil(dShort*14):Math.min(4,Math.floor((dt-b.d)*3)),dec:Math.max(2,Math.round(8+Math.max(0,xt-b.x)*3-xShort*2)),cor:xShort?Math.ceil(xShort*13):-Math.min(3,Math.floor((xt-b.x)*2))}}function preview(el,text,bad){el.textContent=text;el.className='pill '+(bad?'danger':'good')}function sync(){let b=beats[Math.min(s.i,9)],c=calc();$('beat').textContent=`ターン ${Math.min(s.i+1,10)} / 10`;$('demand').textContent=s.state==='playing'?`必要: ドローン ${b.d.toFixed(1)}秒 / 解析 ${b.x.toFixed(1)}秒`:'任務終了';$('hpText').textContent=`${s.hp}%`;$('decodeText').textContent=`${s.dec}%`;$('corruptText').textContent=`${s.cor}%`;$('hp').style.width=s.hp+'%';$('decode').style.width=s.dec+'%';$('corrupt').style.width=s.cor+'%';$('droneTime').textContent=c.dt.toFixed(1);$('decodeTime').textContent=c.xt.toFixed(1);preview($('dronePreview'),`ドローン ${c.dhp>=0?'+':''}${c.dhp}%`,c.dhp<0);preview($('decodePreview'),`解析 +${c.dec}% / 汚染 ${c.cor>=0?'+':''}${c.cor}%`,c.cor>0);window.__DAILY_GAME__.state=s.state}$('split').addEventListener('input',sync);$('commit').addEventListener('click',()=>{if(s.state!=='playing')return;let c=calc();s.hp=Math.max(0,Math.min(100,s.hp+c.dhp));s.dec=Math.max(0,Math.min(100,s.dec+c.dec));s.cor=Math.max(0,Math.min(100,s.cor+c.cor));s.i++;if(s.hp<=0||s.cor>=100)return finish('任務失敗。配分を変えて再挑戦しよう。','lost');if(s.i>=10)return finish(s.dec>=100?'脱出成功！ 2つの仕事を両立できた。':`解析 ${s.dec}% — あと少し届かなかった。`,s.dec>=100?'won':'lost');$('msg').textContent=c.dhp<0||c.cor>0?'片側にしわ寄せが出た。次で立て直そう。':'両方を安全に処理。余剰を次へ積めた。';sync()});function finish(t,state){s.state=state;$('msg').textContent=t;$('commit').hidden=true;$('restart').hidden=false;$('split').disabled=true;sync()}$('restart').addEventListener('click',reset);window.__DAILY_GAME__={ready:true,state:'playing',restart:reset};reset();</script></body></html>
